apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "mosaicod.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mosaicod.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: grpc
      port: 6726
      targetPort: grpc
      appProtocol: grpc
