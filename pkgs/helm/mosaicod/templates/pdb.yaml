apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "mosaicod.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "mosaicod.labels" . | nindent 6 }}
      app.kubernetes.io/component: server
